<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850"><rect width="1200" height="850" fill="#f4f7fb"/><rect width="1200" height="100" fill="#183153"/><text x="55" y="42" font-family="Arial" font-size="20" fill="#c8d8ef">MODEL LAB EXAM · Q3</text><text x="55" y="78" font-family="Arial" font-size="30" font-weight="bold" fill="#fff">Node.js Express Notes — Docker Output</text>
<rect x="55" y="140" width="530" height="560" rx="14" fill="#fff" stroke="#dce4ef"/><rect x="55" y="140" width="530" height="58" rx="14" fill="#e4f0ff"/><text x="85" y="178" font-family="Arial" font-size="24" font-weight="bold" fill="#243550">Notes App · localhost:3000</text><text x="85" y="235" font-family="Arial" font-size="20" fill="#536780">POST /notes</text><rect x="85" y="255" width="470" height="90" rx="8" fill="#f6f8fb" stroke="#ccd7e5"/><text x="105" y="290" font-family="monospace" font-size="18" fill="#243550">{ "text": "Complete lab exam" }</text><text x="85" y="390" font-family="Arial" font-size="20" fill="#536780">Response: 201 Created</text><rect x="85" y="410" width="470" height="105" rx="8" fill="#eaf7ef"/><text x="105" y="450" font-family="monospace" font-size="18" fill="#23613e">{ "id": 1, "text": "Complete lab exam" }</text><text x="85" y="565" font-family="Arial" font-size="20" fill="#536780">GET /notes</text><rect x="85" y="585" width="470" height="80" rx="8" fill="#f6f8fb" stroke="#ccd7e5"/><text x="105" y="630" font-family="monospace" font-size="18" fill="#243550">[ { "id": 1, "text": "Complete lab exam" } ]</text>
<rect x="620" y="140" width="525" height="560" rx="14" fill="#152238"/><text x="655" y="180" font-family="Arial" font-size="24" font-weight="bold" fill="#fff">Docker Terminal</text><g font-family="monospace" font-size="18" fill="#d8e4f4"><text x="655" y="235">$ docker build -t notes-app .</text><text x="655" y="275" fill="#8ce0a7">Successfully built image</text><text x="655" y="330">$ docker run -d -p 3000:3000 notes-app</text><text x="655" y="370" fill="#8ce0a7">Container started: notes-app</text><text x="655" y="425">$ curl localhost:3000/notes</text><text x="655" y="465" fill="#8ce0a7">HTTP/1.1 200 OK</text><text x="655" y="520">$ docker ps</text><text x="655" y="560" fill="#8ce0a7">notes-app · Up · 0.0.0.0:3000</text><text x="655" y="625">$ docker push username/notes-app</text><text x="655" y="665" fill="#8ce0a7">Image pushed to Docker Hub (sample)</text></g><rect x="55" y="735" width="1090" height="65" rx="10" fill="#fff" stroke="#dce4ef"/><text x="80" y="775" font-family="Arial" font-size="18" fill="#52647d">Dockerfile and test output shown as illustrative evidence. Notes stored in container memory disappear when container is removed unless a volume is used.</text></svg>