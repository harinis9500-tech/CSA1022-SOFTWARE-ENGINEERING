<rect x="55" y="285" width="540" height="430" rx="12" fill="#152238"/><text x="85" y="330" font-family="Arial" font-size="24" font-weight="bold" fill="#fff">signup.py</text><g font-family="monospace" font-size="19" fill="#d8e4f4"><text x="85" y="380">def signup(username, password):</text><text x="85" y="425">    if not username.strip():</text><text x="85" y="460">        return "Username required"</text><text x="85" y="505">    if len(password) &lt; 6:</text><text x="85" y="540">        return "Password too short"</text><text x="85" y="585">    return "Signup successful"</text><text x="85" y="650" fill="#8ce0a7">Validation tests: PASS (sample)</text></g>
