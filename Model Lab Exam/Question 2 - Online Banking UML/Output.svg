<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850"><rect width="1200" height="850" fill="#f4f7fb"/><rect width="1200" height="100" fill="#183153"/><text x="55" y="42" font-family="Arial" font-size="20" fill="#c8d8ef">MODEL LAB EXAM · Q2</text><text x="55" y="78" font-family="Arial" font-size="30" font-weight="bold" fill="#fff">Online Banking — UML Class Diagram</text>
<g font-family="Arial" fill="#20334e" stroke="#52749c" stroke-width="2"><rect x="80" y="180" width="300" height="220" rx="8" fill="#fff"/><rect x="80" y="180" width="300" height="50" rx="8" fill="#e4f0ff"/><text x="230" y="212" text-anchor="middle" font-size="24" font-weight="bold" stroke="none">Customer</text><path d="M80 230 H380 M80 310 H380" stroke="#52749c"/><text x="100" y="260" font-size="18" stroke="none">- customerId: int</text><text x="100" y="288" font-size="18" stroke="none">- name: String</text><text x="100" y="340" font-size="18" stroke="none">+ login()</text><text x="100" y="370" font-size="18" stroke="none">+ viewAccounts()</text>
<rect x="450" y="180" width="300" height="220" rx="8" fill="#fff"/><rect x="450" y="180" width="300" height="50" rx="8" fill="#eaf7ef"/><text x="600" y="212" text-anchor="middle" font-size="24" font-weight="bold" stroke="none">Account</text><path d="M450 230 H750 M450 310 H750" stroke="#52749c"/><text x="470" y="260" font-size="18" stroke="none">- accountNo: String</text><text x="470" y="288" font-size="18" stroke="none">- balance: decimal</text><text x="470" y="340" font-size="18" stroke="none">+ deposit(amount)</text><text x="470" y="370" font-size="18" stroke="none">+ withdraw(amount)</text>
<rect x="820" y="180" width="300" height="220" rx="8" fill="#fff"/><rect x="820" y="180" width="300" height="50" rx="8" fill="#fff2e5"/><text x="970" y="212" text-anchor="middle" font-size="24" font-weight="bold" stroke="none">Transaction</text><path d="M820 230 H1120 M820 310 H1120" stroke="#52749c"/><text x="840" y="260" font-size="18" stroke="none">- transactionId: int</text><text x="840" y="288" font-size="18" stroke="none">- amount: decimal</text><text x="840" y="340" font-size="18" stroke="none">+ transfer()</text><text x="840" y="370" font-size="18" stroke="none">+ record()</text>
<rect x="450" y="520" width="300" height="180" rx="8" fill="#fff"/><rect x="450" y="520" width="300" height="50" rx="8" fill="#e4f0ff"/><text x="600" y="552" text-anchor="middle" font-size="24" font-weight="bold" stroke="none">Notification</text><path d="M450 570 H750 M450 630 H750" stroke="#52749c"/><text x="470" y="600" font-size="18" stroke="none">- message: String</text><text x="470" y="660" font-size="18" stroke="none">+ sendSMSorEmail()</text>
<path d="M380 290 H450 M750 290 H820 M600 400 V520 M970 400 V470 H600 V520" fill="none" stroke="#52749c" stroke-width="3"/><text x="410" y="275" font-size="16" stroke="none">1 owns 1..* accounts</text><text x="770" y="275" font-size="16" stroke="none">1 account records 0..* transactions</text><text x="620" y="460" font-size="16" stroke="none">Account triggers notices</text></g><rect x="80" y="745" width="1040" height="65" rx="10" fill="#fff" stroke="#dce4ef"/><text x="105" y="785" font-family="Arial" font-size="19" fill="#304763">Transfer rule: Account validates available balance before debit; reject amount &gt; balance.</text></svg>