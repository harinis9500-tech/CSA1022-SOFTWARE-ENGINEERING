<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><rect width="1200" height="900" fill="#f4f7fb"/><rect width="1200" height="100" fill="#183153"/><text x="55" y="42" font-family="Arial" font-size="20" fill="#c8d8ef">MODEL LAB EXAM · Q1</text><text x="55" y="78" font-family="Arial" font-size="30" font-weight="bold" fill="#fff">RAPTOR Flowchart — GCD &amp; LCM</text>
<g font-family="Arial" text-anchor="middle" font-size="20" fill="#20334e" stroke="#52749c" stroke-width="2">
<rect x="440" y="135" width="320" height="65" rx="32" fill="#e4f0ff"/><text x="600" y="176" stroke="none">START</text>
<path d="M600 200 V230" stroke="#52749c" fill="none"/><rect x="440" y="230" width="320" height="70" rx="10" fill="#fff"/><text x="600" y="272" stroke="none">Input A, B</text>
<path d="M600 300 V330" stroke="#52749c" fill="none"/><rect x="440" y="330" width="320" height="70" rx="10" fill="#fff"/><text x="600" y="372" stroke="none">Set X = A, Y = B</text>
<path d="M600 400 V430" stroke="#52749c" fill="none"/><path d="M600 430 L735 500 L600 570 L465 500 Z" fill="#fff3d9"/><text x="600" y="507" stroke="none">Y = 0 ?</text>
<path d="M465 500 H290 V615" stroke="#52749c" fill="none"/><text x="350" y="483" stroke="none" font-size="17">NO</text>
<rect x="125" y="615" width="330" height="70" rx="10" fill="#fff"/><text x="290" y="657" stroke="none">R = X mod Y</text>
<path d="M290 685 V720" stroke="#52749c" fill="none"/><rect x="125" y="720" width="330" height="70" rx="10" fill="#fff"/><text x="290" y="762" stroke="none">X = Y ; Y = R</text><path d="M290 720 V700 H80 V500 H465" stroke="#52749c" fill="none"/>
<path d="M735 500 H910 V615" stroke="#52749c" fill="none"/><text x="820" y="483" stroke="none" font-size="17">YES</text><rect x="745" y="615" width="330" height="70" rx="10" fill="#e6f6ea"/><text x="910" y="657" stroke="none">GCD = X</text><path d="M910 685 V720" stroke="#52749c" fill="none"/><rect x="745" y="720" width="330" height="70" rx="10" fill="#e6f6ea"/><text x="910" y="762" stroke="none">LCM = (A × B) / GCD</text><path d="M910 790 V825" stroke="#52749c" fill="none"/><rect x="745" y="825" width="330" height="55" rx="27" fill="#e4f0ff"/><text x="910" y="860" stroke="none">Output GCD, LCM · END</text></g>
<text x="55" y="855" font-family="Arial" font-size="18" fill="#52647d">Sample trace: A=48, B=18 → GCD=6, LCM=144 | A=12, B=18 → GCD=6, LCM=36</text></svg>